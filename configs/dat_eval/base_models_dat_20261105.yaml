# DAT on local base (pretrained, not instruction-tuned) models, framed as text completion.
# Same prompt text, temperatures, trials, top_p/top_k, max tokens, and GloVe scoring as the paper's
# instruct-model DAT (configs/dat_eval/run_evals.yaml); the only change is the completion frame.
output_dir: data/dat_eval/base_models_dat_20261105
glove_path: resources/glove.840B.300d.txt
instruct_scores_path: /Users/schapiro/Desktop/Experiments/semantic-distance-creativity/data/scores/multi_embed_scores.json

temperatures: [1.0, 1.5, 2.0]
n_trials: 40
seed: 1000            # torch seed per temperature batch
top_p: 1.0
top_k: 0              # 0 = disabled, as in the API runs
max_new_tokens: 256
dtype: bfloat16
device: mps

# base model -> the instruct model in the paper's pool it was tuned into (null if none)
models:
  - {hf_id: meta-llama/Llama-3.2-3B, instruct: meta-llama_llama-3-2-3b-instruct}
  - {hf_id: meta-llama/Llama-3.1-8B, instruct: meta-llama_llama-3-1-8b-instruct}
  - {hf_id: Qwen/Qwen2.5-7B, instruct: qwen_qwen-2-5-7b-instruct}
  - {hf_id: mistralai/Mistral-7B-v0.1, instruct: mistralai_mistral-7b-instruct-v0-1}
  - {hf_id: google/gemma-2-2b, instruct: google_gemma-2-2b-it}
  - {hf_id: google/gemma-2-9b, instruct: google_gemma-2-9b-it}
