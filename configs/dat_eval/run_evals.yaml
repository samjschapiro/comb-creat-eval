# Config for running DAT, CDAT, and PACE evaluations.
# Models are ordered cheap-to-expensive. The budget_usd cap will stop the run
# before cumulative estimated spend exceeds the cap.
output_dir: "data/dat_eval/run_v1"

# Budget cap in USD. Run aborts before exceeding this.
# Remaining OpenRouter credit is ~$34 (started at $50, spent ~$16).
# Setting a slightly lower cap to leave some margin for estimation error.
budget_usd: 30.0

# Max concurrent in-flight API calls. OpenRouter's rate ceiling scales with
# credit balance (~$34 ≈ 30 req/s). 20 leaves headroom for retries.
concurrency: 20

# Per-eval temperature lists
# DAT/CDAT: temps 1.0, 1.5, 2.0 to get meaningful variance — lower temps produce
# near-deterministic "canonical answers" even with seed variation
# PACE: temp=0.0 per the original Qiu & Hu paper (variance from 50 distinct seeds)
dat_temperatures: [1.0, 1.5, 2.0]
cdat_temperatures: [1.0, 1.5, 2.0]
pace_temperatures: [0.0]

# Sampling controls — for DAT/CDAT we want maximum diversity, so disable nucleus
# and top-k filtering. Provider defaults often apply top_p~0.9 which suppresses
# tail tokens and prevents temperature from breaking canonical-answer priors.
dat_top_p: 1.0
dat_top_k: 0
cdat_top_p: 1.0
cdat_top_k: 0
# PACE: leave at provider defaults (paper doesn't specify; only sets temp=0)

# Max output tokens per call — prevents runaway generation at high temperatures
# (weak models can hallucinate tokens indefinitely). Sized generously enough for
# the expected JSON structure.
dat_max_tokens: 256           # 10 words in JSON + some margin
cdat_max_tokens: 256          # 10 words in JSON + some margin
pace_stage1_max_tokens: 400   # 3 words with reasons
pace_stage2_max_tokens: 1200  # 20 words with reasons (can get verbose)

dat_trials: 40

evals:
  - dat
  - cdat
  - pace

# Models ordered cheap-to-expensive (per estimate_model_cost).
# Cheapest models first so if we hit the budget cap, we lose the least data.
