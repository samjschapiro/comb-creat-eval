# Config for running DAT, CDAT, and PACE evaluations
output_dir: "data/dat_eval/run_v1"

temperature: 0.0
dat_trials: 5  # number of independent DAT trials per model

# Which evaluations to run
evals:
  - dat
  - cdat
  - pace

