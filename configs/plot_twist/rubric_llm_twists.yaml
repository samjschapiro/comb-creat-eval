# Score the generated LLM twist set (downstream of generate_llm_twists.yaml) with
# the fixed-rubric judge. Same judge ensemble as the gold set, for comparability.
stimuli_file: "data/plot_twist/llm_twists/generations.json"
meta_fields: ["model", "temperature", "sample"]

judge_models:
  - "anthropic/claude-sonnet-4"
  - "openai/gpt-4o"
  - "google/gemini-2.5-flash"

temperature: 0.0
max_tokens: 400
concurrency: 16

output_dir: "data/plot_twist/llm_twists/downstream/rubric"
