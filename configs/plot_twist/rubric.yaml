# Fixed-rubric LLM-as-judge (plot_twist §3 benchmark metric).
# Ensemble of independent judges; each dimension aggregated by the median.
judge_models:
  - "anthropic/claude-sonnet-4"
  - "openai/gpt-4o"
  - "google/gemini-2.5-flash"

temperature: 0.0
max_tokens: 400
concurrency: 16

# Optional path to a stimuli JSON: list of {"id", "story", "label"} objects.
# If null, the smoke runner uses a built-in twist/predictable/random triple.
stimuli_file: null

output_dir: "data/plot_twist/rubric_smoke"
