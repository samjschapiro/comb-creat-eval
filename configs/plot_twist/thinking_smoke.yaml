# Exp 1 SMOKE: which reasoning-capable pool models accept low/high effort via the
# OpenRouter unified `reasoning` API and actually return reasoning tokens? n=1/cell,
# short stories -- cheap validation before the paid intervention run.
n_samples: 1
temperatures: [1.0]
max_tokens: 16000         # high cap: thinking + a full story (billed per actual token, so a big cap is free)
concurrency: 12

reasoning_levels:
  - {name: "low",  reasoning: {effort: "low"}}
  - {name: "high", reasoning: {effort: "high"}}

# Reasoning-capable candidates already in the 74-source benchmark pool, spanning
# providers (so the within-model intervention aligns with existing observational data).
generator_models:
  - "openai/gpt-5.4"
  - "openai/gpt-5.4-mini"
  - "anthropic/claude-sonnet-4.6"
  - "anthropic/claude-opus-4.6"
  - "google/gemini-2.5-pro"
  - "deepseek/deepseek-v3.2-exp"
  - "z-ai/glm-5.1"
  - "qwen/qwen3-14b"
  - "moonshotai/kimi-k2.5"
  - "nvidia/nemotron-3-super-120b-a12b"
  - "deepcogito/cogito-v2.1-671b"

judge_models_excluded:
  - "anthropic/claude-sonnet-4"
  - "openai/gpt-4o"
  - "google/gemini-2.5-flash"

output_dir: "data/plot_twist/thinking_smoke"
