# Exp 2: PROMPT-METHOD intervention. We GENERATE two prompt conditions and compare each (in
# analysis) to the REUSED main-run baseline for the same models, so the only thing that varies
# within a model is the prompting method (cf. Exp 1 = reasoning effort).
#   - be_creative:     n independent samples with a "be creative / be original" instruction
#                      appended (NoveltyBench system-prompt instruction / CREATE "be creative").
#   - incontext_regen: n sequential samples; after each story a cheap model distils its twist
#                      to one line and the next prompt asks for a DIFFERENT twist
#                      (summary-conditioned variant of NoveltyBench "in-context regeneration"
#                      / CREATE "iterative" -- full prior stories in context are too expensive).
#                      arXiv:2504.05228, arXiv:2603.09970.
methods: ["be_creative", "incontext_regen"]
n_samples: 8                 # samples per (model x method); temp fixed (matches baseline temp)
temperatures: [1.0]
max_tokens: 4500             # ~3k-word story, no explicit reasoning dial here
concurrency: 12
summarizer_model: "openai/gpt-4o-mini"   # cheap twist distiller fed back for regeneration

# Small reasoning-capable subset (a 5-model, capability-diverse slice of the Exp 1 pool:
# frontier -> strong-open -> small-open, 5 distinct providers). Disjoint from judges.
generator_models:
  - "openai/gpt-5.4"
  - "anthropic/claude-opus-4.8"
  - "google/gemini-2.5-pro"
  - "deepseek/deepseek-v3.2-exp"
  - "qwen/qwen3-14b"
  # completing the reasoning subset (thinking-9 members with reusable main-run baseline)
  - "anthropic/claude-sonnet-4.6"
  - "nvidia/nemotron-3-super-120b-a12b"
  - "deepcogito/cogito-v2.1-671b"

judge_models_excluded:
  - "anthropic/claude-sonnet-4"
  - "openai/gpt-4o"
  - "google/gemini-2.5-flash"

output_dir: "data/plot_twist/prompt_methods"
