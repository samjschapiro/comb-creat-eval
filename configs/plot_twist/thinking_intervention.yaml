# Exp 1: CAUSAL thinking intervention. Each model writes plot-twist stories at three
# reasoning-effort levels (low/medium/high), temperature held FIXED at 1.0 so the only
# thing that varies within a model is the amount of thinking. The within-model contrast
# removes the model-identity confound of the observational pool. We persist the reasoning
# TRACE and reasoning-token count per story; analysis uses REALIZED reasoning_tokens as
# the continuous dose (nominal effort is just the instrument that induces variation).
n_samples: 8                 # samples per (model x level); temp fixed
temperatures: [1.0]
max_tokens: 32000            # high cap: heavy thinkers (opus-class) + a full story; billed per actual token
concurrency: 12

reasoning_levels:
  - {name: "low",    reasoning: {effort: "low"}}
  - {name: "medium", reasoning: {effort: "medium"}}
  - {name: "high",   reasoning: {effort: "high"}}

# Reasoning-capable pool models that reliably produced stories WITH a thinking dose in
# the 16k smoke (dropped opus-4.6 and gpt-5.4-mini@high: truncate even at 16k).
generator_models:
  - "openai/gpt-5.4"
  - "anthropic/claude-sonnet-4.6"
  - "google/gemini-2.5-pro"
  - "deepseek/deepseek-v3.2-exp"
  - "z-ai/glm-5.1"
  - "qwen/qwen3-14b"
  - "moonshotai/kimi-k2.5"
  - "nvidia/nemotron-3-super-120b-a12b"
  - "deepcogito/cogito-v2.1-671b"

judge_models_excluded:
  - "anthropic/claude-sonnet-4"
  - "openai/gpt-4o"
  - "google/gemini-2.5-flash"

output_dir: "data/plot_twist/thinking"
