# Exp 2 analysis: impact of prompting method on transformational creativity. Downstream of
# the prompt-method generation + rubric + realism scoring. Annotates reveals (diversity
# facet), builds per-(model, method) cells, and reports the WITHIN-MODEL effect
# Δ(incontext_regen - baseline) per facet + the TC composite, with a sign test.
generations_json: "data/plot_twist/prompt_methods/generations.json"
rubric_scores_csv: "data/plot_twist/prompt_methods/downstream/rubric/scores.csv"
realism_scores: "data/plot_twist/prompt_methods/downstream/realism/realism_scores.json"
output_dir: "data/plot_twist/prompt_methods/downstream/analysis"

annotator_model: "openai/gpt-4o-mini"     # reveal extractor for the diversity facet (cheap)
embed_model: "sentence-transformers/all-mpnet-base-v2"
concurrency: 16

baseline_method: "baseline"
treatment_methods: ["be_creative", "incontext_regen"]   # each compared vs the reused baseline
method_order: ["baseline", "be_creative", "incontext_regen"]

# Baseline is REUSED from the main 73-model run (no re-generation, no re-scoring): pull the
# same 5 models' independent samples at the matching temperature and merge their existing
# rubric + realism scores. Reveals for these are re-annotated cheaply alongside the new ones.
subset_models:
  - "openai/gpt-5.4"
  - "anthropic/claude-opus-4.8"
  - "google/gemini-2.5-pro"
  - "deepseek/deepseek-v3.2-exp"
  - "qwen/qwen3-14b"
  - "anthropic/claude-sonnet-4.6"
  - "nvidia/nemotron-3-super-120b-a12b"
  - "deepcogito/cogito-v2.1-671b"
baseline_temperature: 1.0
baseline_n_samples: 8
baseline_generations_json: "data/plot_twist/llm_twists/generations.json"
baseline_rubric_scores_csv: "data/plot_twist/llm_twists/downstream/rubric/scores.csv"
baseline_realism_scores: "data/plot_twist/realism/realism_scores.json"
