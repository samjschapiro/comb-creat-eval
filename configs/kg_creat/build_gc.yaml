# Build a DOMAIN-SPANNING Wikidata G_c. Domain is a key independent variable, so seeds are
# chosen to deliberately cover distinct domains; every entity inherits the domain of the seed
# whose neighborhood reached it. The relation vocabulary is frequency-derived, and the
# analogy/blend/endpoint pairs are randomly sampled from the graph.
#
# v2 (2026-07-26): grown from 22 -> 51 seeds across 15 domains (~3-4 anchors/domain) to widen the
# prominent-entity pool for a CREATE-parity (~931-query) benchmark without heavy entity reuse.
# radius stays 2 (radius 3 explodes and pulls obscure tails); max_neighbors 40 -> 50 to densify.
output_dir: data/kg_creat/gc_domains_v2
name: gc_domains_v2
radius: 2
max_neighbors_per_relation: 50
top_n_relations: 28
vocab_sample_radius: 1
vocab_survey_entities: 1200

seeds:                       # {well-known anchor: domain}
