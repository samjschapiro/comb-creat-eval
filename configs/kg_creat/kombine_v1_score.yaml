# Kombine v1 scoring: task-specific judges (fusion J_Bl, analogy J_An, factuality) + MLX embeddings.
# Run WITHOUT LLM_BASE_URL (judge on OpenRouter); use .venv_mlx (MLX embedder).
upstream_dir: data/kg_creat/kombine_v1/responses
output_dir: data/kg_creat/kombine_v1/scores
exclude_models: [google/gemma-2-9b-it]
judge:
  enabled: true
  models:                        # 3-judge panel, majority vote
    - openai/gpt-oss-120b
    - deepseek/deepseek-chat-v3-0324
    - anthropic/claude-haiku-4.5
  concurrency: 32
embedding:
  model: mlx-community/all-MiniLM-L6-v2-4bit
