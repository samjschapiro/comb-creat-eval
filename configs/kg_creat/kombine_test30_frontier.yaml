# Kombine test30 FRONTIER expansion: 13 frontier flagships at 30 items/task (90 prompts each),
# appended to the existing test30 responses (resume-safe: skips the 6 already done). Default reasoning
# effort, traces saved. Models ordered cheap -> expensive so a runaway is caught before the priciest.
# The budget cap tracks ACTUAL billed cost per model (reasoning tokens included) and halts before the
# next model once exceeded. Dropped the 4 legacy-priced whales (opus-4.6, fable-5, o3, gpt-5.4): each
# provider's CURRENT flagship is kept. PAID (OpenRouter) — expected ~$42 (worst case ~$71); hard cap $75.
upstream_dir: data/kg_creat/kombine_test30/prompts
output_dir: data/kg_creat/kombine_test30/responses
modes: [baseline, analogy, blending]
eval:
  temperatures: [0.9]
  n_samples: 1
  max_tokens: 1600
concurrency: 8
reasoning:
  exclude: false             # default effort; RETURN + SAVE the trace for reasoning models
budget_usd: 75.0            # HARD cap: actual-cost stop halts before the next model once spend >= this
models:
  - mistralai/mistral-large-2512
  - qwen/qwen3-max
  - z-ai/glm-4.6
  - deepseek/deepseek-r1
  - google/gemini-3-flash-preview
  - x-ai/grok-4.5
  - google/gemini-2.5-pro
  - anthropic/claude-sonnet-5
  - openai/gpt-5.6-sol
  - google/gemini-3.1-pro-preview
  - openai/gpt-5.2
  - openai/gpt-5
  - anthropic/claude-opus-5
