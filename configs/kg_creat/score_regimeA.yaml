# Regime-A round 1: score baseline + 5 constrained cells on fixed endpoints (8 models).
# Run WITHOUT LLM_BASE_URL set so the judge routes to OpenRouter; embeddings stay local (MLX).
upstream_dir: data/kg_creat/responses_regimeA_all
output_dir: data/kg_creat/scores_regimeA_all

judge:
  enabled: true
  model: openai/gpt-oss-120b     # CREATE's factuality judge; reliable; ~$2.1 for this round (~10.5k calls)
  concurrency: 32                # measured sweet spot for gpt-oss-120b (c=16 ~47/min, c=32 ~62/min,
                                 # c=64 no better + unparseable responses). Batching and low
                                 # reasoning-effort were both tested and rejected (slower / drifted).

embedding:
  model: mlx-community/all-MiniLM-L6-v2-4bit
