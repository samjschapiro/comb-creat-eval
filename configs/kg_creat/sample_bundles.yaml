# Sample the round-1 prompt set from the cached pilot G_c.
upstream_dir: data/kg_creat/gc_domains_v1      # domain-spanning G_c (from build_gc.py)
output_dir: data/kg_creat/prompts_regimeA_v1

sampler:                # Regime A (matched bundles: baseline + biting A-D constraints)
  h: 3
  k: 5
  min_routes: 6         # >= this many h-hop routes so constraints bite without breaking
  min_degree: 4         # endpoints must be prominent (undirected degree)
  max_bundles: 30       # Regime-A scale-up: 30 matched bundles, endpoints fixed across all cells
  max_paths: 64         # cap on enumerated feasible routes (biting stats are relative to this)
  require_constraints: 3  # keep a bundle only if >= 3 of the 4 A-D types bite-and-satisfy
  max_per_source: 3     # <= 3 bundles per source entity, for endpoint diversity

regime_b:               # analogy/blending endpoints = RANDOM entity pairs from G_c (seeded).
  # No hand-curation: the task is to find a valid analogy/blend between arbitrary, non-obviously
  # related entities -- that difficulty is the point. Curated canonical pairs would trivialize it.
  n_analogy: 0          # Regime-A run: analogy already done (scores_analogy_v2); blending gets
  n_blend: 0            # its own 1-stimulus design later, so no Regime-B cells here
  seed: 0
  min_degree: 3         # endpoints are real (non-class) entities with some connectivity
