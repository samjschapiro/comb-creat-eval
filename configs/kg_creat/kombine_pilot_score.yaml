# Kombine PILOT scoring: factuality judge (OpenRouter) + local MLX embeddings for surprise.
# Run WITHOUT LLM_BASE_URL so the judge routes to OpenRouter; embeddings stay local (MLX).
# Use the .venv_mlx environment for this step (MLX embedder).
upstream_dir: data/kg_creat/kombine_pilot/responses
output_dir: data/kg_creat/kombine_pilot/scores

exclude_models:                          # llama-3.1-8b parsed only ~54% -> skip
  - meta-llama/llama-3.1-8b-instruct

judge:
  enabled: true
  model: openai/gpt-oss-120b     # CREATE's factuality judge; cheap for a pilot
  concurrency: 32

embedding:
  model: mlx-community/all-MiniLM-L6-v2-4bit
