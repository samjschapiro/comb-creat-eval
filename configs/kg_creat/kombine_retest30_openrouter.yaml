# TEST-RETEST (2026-09-15): models that were drawn through OpenRouter for test30, re-elicited under the
# same conditions (T = 0.9, default effort, 8k thinking cap, traces saved) on the retest30 items.
# Ordered cheap -> expensive. The three Claude models moved to the direct-key config on 2026-09-15 (see
# kombine_retest30_anthropic_direct.yaml); what remains here is ~$3 for the three small OpenAI models,
# which the OpenRouter key's remaining ~$18 covers.
upstream_dir: data/kg_creat/kombine_retest30/prompts
output_dir: data/kg_creat/kombine_retest30/responses
modes: [baseline, analogy, blending]
eval:
  temperatures: [0.9]
  n_samples: 1
  max_tokens: 1600
concurrency: 8
reasoning:
  exclude: false
  max_tokens: 8000
budget_usd: 12.0             # HARD cap (actual-cost stop), under the key's ~$18 headroom
models:
  - openai/gpt-4o-mini
  - openai/gpt-4.1
  - openai/gpt-5-mini
