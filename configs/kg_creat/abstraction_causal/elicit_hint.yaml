# Abstraction-bottleneck CAUSAL test (rebuttal), condition: hint. See src/kg_creat/scripts/build_abstraction_causal.py.
# Same settings as the paper's blend run (kombine_test30_blendv3.yaml): T=0.9, one draw, default reasoning effort.
# PAID (OpenRouter). Models ordered cheap -> expensive so a runaway halts before the priciest.
upstream_dir: data/kg_creat/abstraction_causal/hint/prompts
output_dir: data/kg_creat/abstraction_causal/hint/responses
modes: [blending]
eval:
  temperatures: [0.9]
  n_samples: 1
  max_tokens: 1600
concurrency: 12
reasoning:
  exclude: false
  max_tokens: 8000
budget_usd: 5.0                      # HARD cap per condition (est ~$2.4: opus-5 ~$1.6 + gpt-5.2 ~$0.6 + the rest pennies)
models:
  - meta-llama/llama-3.3-70b-instruct
  - qwen/qwen-2.5-72b-instruct
  - openai/gpt-4o-mini
  - deepseek/deepseek-chat-v3-0324
  - openai/gpt-5.2
  - anthropic/claude-opus-5
