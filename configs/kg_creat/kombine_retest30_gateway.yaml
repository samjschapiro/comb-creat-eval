# TEST-RETEST (2026-09-15): the two OpenAI frontier models served by the LiteLLM gateway ($0 billing),
# re-elicited on the retest30 items under their test30 conditions (default effort; the gateway rejects
# temperature, so none is sent; absolute, generous max_tokens). NOT RUNNABLE while the gateway refuses
# TLS connections (2026-09-14/15). gpt-5.6-sol was drawn via OpenRouter for test30, so its gateway
# draw is a provider deviation to record if used.
upstream_dir: data/kg_creat/kombine_retest30/prompts
output_dir: data/kg_creat/kombine_retest30/responses
modes: [baseline, analogy, blending]
provider:
  kind: openai_compatible
  base_url_env: LITELLM_BASE_URL
  api_key_env: LITELLM_API_KEY
eval:
  temperatures: [0.9]        # not sent
  n_samples: 1
  max_tokens: 64000
  max_tokens_absolute: true
concurrency: 6
budget_usd: 25.0             # guard, not a budget (gateway bills $0)
models:
  - openai/gpt-6-astra-flex
  - openai/gpt-5.6-sol
