# Diversity pilot, Stage 2: the 4 constraint cells (exclusion/inclusion/inclusion_rare/categorical)
# on the SAME endpoints as Stage 1, 3 cheap models, M=10 x temps {0.7,0.9,1.0}. Targets are
# baseline-derived (make_pass2) so each constraint bites by construction.
upstream_dir: data/kg_creat/prompts_rand_v2_pass2
output_dir: data/kg_creat/responses_rand_v2_pass2
modes: []
eval:
  temperatures: [0.7, 0.9, 1.0]
  n_samples: 10
  max_tokens: 1600
concurrency: 16
budget_usd: 20.0
models:
  - meta-llama/llama-3.1-8b-instruct
  - google/gemini-2.5-flash-lite
  - meta-llama/llama-3.3-70b-instruct
