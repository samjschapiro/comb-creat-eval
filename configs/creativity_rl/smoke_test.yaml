# Smoke test: 50 GRPO steps on Llama-3.2-1B with Skywork-Reward-Llama-3.1-8B (4-bit).
# Goal: verify end-to-end pipeline runs, reward flows, archive grows, wandb logs.

output_dir: data/creativity_rl/runs/smoke_test_v1

seed: 17

dataset:
  train:
    hf_name: liweijiang/infinite-chats-eval
    split: train
    max_prompts: 50          # small for smoke
    text_field: query
  # No test set used during smoke; eval is a separate script.

policy:
  # Public, ungated — avoids HF token requirement for smoke test.
  base_model: Qwen/Qwen2.5-1.5B-Instruct
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

ref_policy:
  model: null

appropriateness:
  # Public, ~435M params, sentence-pair format. Swap to Skywork/ArmoRM
  # for full runs once HF token is configured.
  rm_model: OpenAssistant/reward-model-deberta-v3-large-v2
  rm_load_in_4bit: false
  rm_max_length: 512
  threshold_tau: -2.0        # placeholder; smoke test skips calibration
  calibration:
    skip: true               # smoke only — full runs must calibrate
  recalibrate_every_steps: null

novelty:
  embedding_model: sentence-transformers/all-mpnet-base-v2
  distance: cosine
  k_nearest: 5               # smaller than full run (15) — archive is tiny
  archive:
    scope: per_prompt_cluster
    n_clusters: 1            # smoke = single global cluster (skip KMeans)
    cluster_embedding_model: sentence-transformers/all-mpnet-base-v2
    index_type: hnsw
    hnsw_m: 32
    hnsw_ef_construction: 200
    max_size_per_cluster: 2000
    admission_novelty_threshold: median

reward:
  type: mcns_hard
  soft_temperature: null

rl:
  algorithm: grpo
  group_size_K: 4            # smaller than full run (8)
  kl_coefficient_beta: 0.05
  learning_rate: 1.0e-5
  total_steps: 50
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  prompts_per_step: 4
  generation:
    max_new_tokens: 128      # smaller than full run (256)
    temperature: 1.0
    top_p: 1.0
  save_every_steps: 50
  eval_every_steps: null

logging:
  wandb:
    enabled: true
    project: comb-creat-eval
    group: creativity_rl
    run_name: smoke_test_v1
    tags: [smoke, mcns, grpo, lora, llama-1b]
  log_every_steps: 1
  log_generations_every_steps: 10
  log_archive_stats_every_steps: 5

budget:
  max_usd: 10
