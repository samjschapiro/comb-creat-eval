# DMPO math replication (arXiv:2605.19461). Paper hyperparameters,
# adapted for a single 80GB GPU via LoRA. Math reward is rule-based
# (format 0.1 + correctness 1.0) so no reward model is loaded -- VRAM
# is just policy + GRPO rollouts.

output_dir: data/creativity_rl/dmpo_math_dmpo
method: dmpo
seed: 17

policy:
  base_model: Qwen/Qwen2.5-Math-7B-Instruct
  lora:                            # single-GPU concession to paper's full FT
    rank: 32
    alpha: 64
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  source: openr1_math              # paper §5 uses Openr1-Math-46K; this is
                                   # the closest public artifact (open-r1's
                                   # 220k math set, subsampled below).
  n_prompts: 4000                  # 250 steps x 2 prompts/step = 500 used;
                                   # 4k pool is well above that and fast
                                   # to load. Set 46000 for exact paper pool.

reward:
  format_weight: 0.1               # paper r_fmt
  correct_weight: 1.0              # paper r_opt (binary correctness for math)

rl:
  algorithm: grpo
  group_size_K: 8                  # paper N=8
  kl_coefficient_beta: 0.0         # paper beta_KL=0 (no reference penalty)
  scale_rewards: true              # paper uses GRPO's z-scored advantages
  learning_rate: 1.0e-6            # paper actor lr
  entropy_coeff: 0.0
  total_steps: 250                 # paper 250 iterations
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # 2 prompts/step (K=8 divides 16); 80GB-safe
  gradient_checkpointing: true     # memory neutral wrt gradients
  lr_scheduler_type: cosine        # paper cosine decay
  generation:
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
  save_every_steps: 100

dmpo:
  lambda: 2.0                      # paper lambda=2.0
  alpha: 0.0666666667              # paper alpha=1/15

logging:
  wandb:
    enabled: true
    project: comb-creat-eval
    group: dmpo_repro
    run_name: dmpo_math_dmpo
    tags: [dmpo, grpo, math, gsm8k, qwen2.5-math-7b]
  log_every_steps: 2
  log_completions: true
  num_completions_to_print: 8

budget:
  max_usd: 80
