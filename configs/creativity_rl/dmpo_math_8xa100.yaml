# DMPO math replication for 8x A100-80GB SXM4: FULL fine-tuning
# (paper-faithful; LoRA dropped). FSDP shards optimizer states across the
# 8 GPUs so Qwen2.5-Math-7B + AdamW fits comfortably (~14 GB per rank
# sharded + activations). Rule-based math reward = no RM in VRAM.

output_dir: data/creativity_rl/dmpo_math_8xa100_dmpo
method: dmpo
seed: 17

policy:
  base_model: Qwen/Qwen2.5-Math-7B-Instruct
  lora:                            # FSDP1+embedding layer is broken in
    rank: 32                       # this stack ('weight must be 2-D');
    alpha: 64                      # using LoRA+DDP across 8 GPUs instead.
    dropout: 0.0                   # Deviation from paper's full FT, but
    target_modules:                # the DMPO-vs-GRPO comparison is
      [q_proj, k_proj, v_proj,     # preserved; full FT can be revisited
       o_proj, gate_proj,          # later with FSDP2 or DeepSpeed.
       up_proj, down_proj]

data:
  source: openr1_math
  n_prompts: 4000

reward:
  format_weight: 0.1
  correct_weight: 1.0

rl:
  algorithm: grpo
  group_size_K: 8                  # paper N=8
  kl_coefficient_beta: 0.0         # paper beta_KL=0 (no reference penalty)
  scale_rewards: true              # paper GRPO z-scored advantages
  learning_rate: 1.0e-6            # paper actor lr
  entropy_coeff: 0.0
  total_steps: 250                 # paper 250 iterations
  per_device_train_batch_size: 4   # 4 completions per rank per micro-step
  gradient_accumulation_steps: 2
  # Effective batch (completions): pdtbs(4) x num_procs(8) x accum(2) = 64
  # Prompts/step: 64 / K(8) = 8. Conservative for HF generate; paper used
  # ~64 prompts/step (likely with vLLM), bumping accum to 16 matches that
  # at ~8x cost (toggle once vLLM is wired).
  gradient_checkpointing: true     # darling.sh-style; paper-faithful
  lr_scheduler_type: cosine        # paper cosine decay
  generation:
    max_new_tokens: 1024
    temperature: 1.0
    top_p: 1.0
  save_every_steps: 100

dmpo:
  lambda: 2.0                      # paper lambda
  alpha: 0.0666666667              # paper alpha=1/15

logging:
  wandb:
    enabled: true
    project: comb-creat-eval
    group: dmpo_repro
    run_name: dmpo_math_8xa100_dmpo
    tags: [dmpo, grpo, math, openr1, qwen2.5-math-7b, full-ft, 8xa100, fsdp]
  log_every_steps: 2
  log_completions: true
  num_completions_to_print: 8

budget:
  max_usd: 120
