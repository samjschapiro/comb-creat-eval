# C-PACE v2: semantic constraints instead of lexical.
# Include/exclude constraints reference concept anchors (e.g., "courage", "storm")
# drawn from a curated pool, disjoint from each seed's FastText neighborhood.
# The model is prompted in natural language ("must include a word semantically
# related to 'courage'"), and we verify satisfaction at scoring time via
# FastText cosine similarity to the anchor — the threshold τ is a post-hoc
# knob, NOT baked into the model's prompt.
output_dir: "data/comb_eval/c_pace_v2"

budget_usd: 24.0          # we have $25 in credits; leave small cushion
concurrency: 20

reasoning:
  effort: "low"
  exclude: true
reasoning_max_tokens_multiplier: 4

temperature: 0.0
n_seeds: 20
levels: [1, 2, 3, 4]
n_first_assocs: 3

stage1_max_tokens: 400
stage2_max_tokens: 1200

constraint_seed: 42       # reproducible anchor draws
constraint_type: "semantic"

# τ used as the "documented" threshold, and stored in each saved Constraints
# record. At scoring time the scorer can override with any τ ∈ (0, 1) without
# needing to re-run the LLM.
semantic_threshold: 0.4

# When drawing anchors for a seed, reject any anchor whose FastText cosine
# to the seed is >= this value. Keeps constraints from being trivially
# satisfied by the seed's natural first associations.
semantic_seed_rejection_threshold: 0.4

fasttext_path: "resources/crawl-300d-2M.vec"

# Same model list ordering as v1, cheap → expensive, with the 7 frontier
# models that v1 ran out of budget on still at the end. $25 should fit more
# of them than the $22 v1 cap did, but expect the cap to kick in before
# opus-4.6 again.
