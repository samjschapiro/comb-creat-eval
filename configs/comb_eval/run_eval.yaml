# Config for running the k-paths combinatorial creativity eval via OpenRouter.
# Model list mirrors dat_eval/run_evals.yaml so correlation comparisons across
# tracks use an aligned model set.
upstream_dir: "data/comb_eval/eval_set_v2"
output_dir: "data/comb_eval/eval_set_v2/downstream/run_v1"

# Budget cap in USD. Run aborts before cumulative estimated cost exceeds this.
# Set to 0 to disable. Estimate assumes ~2.3K in / 500 out tokens per call.
budget_usd: 40.0

# Max concurrent in-flight API calls across ALL models for this run. The
# semaphore is shared so one model's burst can't starve another.
concurrency: 20

# Reasoning control. Low effort + exclude keeps reasoning models from burning
# minutes per call on what's fundamentally a path-enumeration task.
reasoning:
  effort: "low"
  exclude: true

# Reasoning models have hidden reasoning tokens counted toward max_tokens, so
# they get `base * reasoning_max_tokens_multiplier`.
reasoning_max_tokens_multiplier: 4

eval:
  # Must match the k_paths used at generation time. The runner validates this
  # against the upstream generation_summary.json and aborts on mismatch.
  k_paths: 5
  # Temperature > 0 so the model has real room to produce distinct paths.
  # (Intra-response diversity is the signal; canonical answers at t=0 would
  # flatten the metric across models.)
  temperature: 1.0
  # Base max_tokens for non-reasoning models. Reasoning models get 4× this.
  max_tokens: 2048

# Model list synced with configs/dat_eval/run_evals.yaml (53 models).
# Ordered non-reasoning cheap→expensive first, then reasoning models last,
# then the small-open-model tail that extends Hivemind coverage.
