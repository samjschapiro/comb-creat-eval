# Full circle construction run. 20 seeds × 3 trials × 54 models, budget-capped.
# Cheap-to-expensive ordering so the budget cap cascades if we run out.
output_dir: "data/comb_eval/circle_v1"

budget_usd: 22.0          # ~$24 in credits, small cushion
concurrency: 20

reasoning:
  effort: "low"
  exclude: true
reasoning_max_tokens_multiplier: 4

# Temperature > 0 so multiple trials per seed give variance (the cross-trial
# diversity metric depends on this).
temperature: 0.7

n_seeds: 20
n_words: 8                # matches Nagarajan & Wu's small-N regime
n_trials: 3
max_tokens: 1024          # JSON with 8 entries + reasons fits comfortably

models:
  - meta-llama/llama-3.2-1b-instruct
  - meta-llama/llama-3.2-3b-instruct
