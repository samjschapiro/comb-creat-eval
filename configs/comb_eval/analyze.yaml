# Config for scoring and correlation analysis.
# Scoring is now intra-response diversity over valid paths; there are no
# tunable scoring weights. Both Jaccard and edit-distance metrics are
# computed and correlated against each benchmark independently.
upstream_dir: "data/comb_eval/eval_set_v2/downstream/run_v1"
output_dir: "data/comb_eval/eval_set_v2/downstream/run_v1/downstream/analysis_v1"

analysis:
  benchmark_file: "configs/comb_eval/benchmarks.json"
  benchmark_columns:
    - arena_cw
    - arena_overall
    - eq_bench_cw
    - eq_bench_cw_rubric
    - hivemind_intra_sim
  n_bootstrap: 500
  seed: 42
