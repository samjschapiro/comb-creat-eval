# Constrained PACE (C-PACE) runner config.
# Two-stage: seed -> 3 first-associations; each first-association -> 20-word
# chain with lexical constraints from one of 4 difficulty levels.
# Constraints are deterministic across models (fixed constraint_seed).
#
# Model list ordered cheap-to-expensive so the budget cap cascades to fit as
# many models as possible into the available credits. At n_seeds=20, running
# the full 54-model list costs ~$70 uncached; at $22 cap we fit ~47 models.
output_dir: "data/comb_eval/c_pace_v1"

# OpenRouter credit available: $23.15. Cap at $22 leaves cushion for
# cost-estimate slippage (reasoning-model output multiplier, longer-than-
# estimated chains, etc).
budget_usd: 22.0
concurrency: 20

reasoning:
  effort: "low"
  exclude: true
reasoning_max_tokens_multiplier: 4

# PACE convention: temperature 0.0. Variance across chains comes from different
# first-associations and different constraint letters per level.
temperature: 0.0

n_seeds: 20
levels: [1, 2, 3, 4]
n_first_assocs: 3

stage1_max_tokens: 400
stage2_max_tokens: 1200

constraint_seed: 42  # fixes the per-(seed, level) constraint draws

# Ordered cheap-to-expensive (estimated per-model costs commented). The
# budget cap processes in list order, so if we run out of money we lose the
# most expensive frontier models — which is where adjacent siblings (opus-4.5,
# gpt-5.4 vs gpt-5, sonnet-4 vs 4.5/4.6) are most redundant anyway.
