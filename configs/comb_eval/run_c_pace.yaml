# Constrained PACE (C-PACE) runner config.
# Two-stage: seed -> 3 first-associations; each first-association -> 20-word
# chain with lexical constraints from one of 4 difficulty levels.
# Constraints are deterministic across models (fixed constraint_seed).
output_dir: "data/comb_eval/c_pace_v1"

budget_usd: 50.0
concurrency: 20

reasoning:
  effort: "low"
  exclude: true
reasoning_max_tokens_multiplier: 4

# PACE convention: temperature 0.0. Variance across chains comes from different
# first-associations and different constraint letters per level.
temperature: 0.0

# n_seeds = 20 first-pass. DEFAULT_SEEDS in c_pace.py has 50; subsetting cuts
# cost roughly proportionally. Bump to 40 or 50 for the final run if signal is
# promising.
n_seeds: 20
levels: [1, 2, 3, 4]
n_first_assocs: 3

# Max output tokens. Stage 1 needs 3 JSON entries (~300 tokens); stage 2 needs
# 20 entries with reasons (~1200 tokens). Reasoning models get 4× via the
# multiplier above.
stage1_max_tokens: 400
stage2_max_tokens: 1200

constraint_seed: 42  # fixes the per-(seed, level) constraint draws

# Model list matches dat_eval/run_evals.yaml so correlations use the same set.
models:
