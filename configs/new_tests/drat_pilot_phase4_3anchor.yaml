  - {anchors: ["democracy", "voting algorithm", "pipeline"]}
  - {anchors: ["contract", "proof", "blueprint"]}
  - {anchors: ["rumor", "broadcast", "transmission"]}

noun_pool_source: "cdat_default_cues"
tau_percentile: 90.0
n_min: 5
temperature: 1.0
max_tokens: 256
seed: 42
top_p: 1.0
concurrency: 6
max_retries: 4
