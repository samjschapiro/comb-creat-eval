# RAT expansion — zero-shot on 50 dat_eval-pool models not in the original
# rat_pilot (n=25). Same 30-item ITEM_BANK_V1, same fixed prompt, same
# strict exact-match scoring. No best-of-k yet — that comes in a follow-up
# run after we see the zero-shot results.
#
# Some IDs may 404 on OpenRouter (the April dat_eval run pre-dates several
# rotations); the runner's retry-then-error-stub path handles failures
# gracefully and reports them in summary.json.

output_dir: "data/new_tests/rat/expansion_v1"

models:
  # Anthropic
  - anthropic/claude-3-haiku
  - anthropic/claude-3.5-sonnet
  - anthropic/claude-haiku-4.5
  - anthropic/claude-sonnet-4
  - anthropic/claude-sonnet-4.5
  - anthropic/claude-sonnet-4.6
  - anthropic/claude-opus-4.5
  - anthropic/claude-opus-4.6

  # OpenAI
  - openai/gpt-3.5-turbo
  - openai/gpt-4.1
  - openai/gpt-4.1-mini
  - openai/gpt-4.1-nano
  - openai/gpt-5
  - openai/gpt-5.2
  - openai/gpt-5.4
  - openai/gpt-5.4-mini
  - openai/gpt-5.4-nano
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/o3
  - openai/o4-mini

  # Google
  - google/gemini-2.5-flash
  - google/gemini-2.5-pro
  - google/gemini-3-flash-preview
  - google/gemini-3.1-pro-preview
  - google/gemini-2.0-pro-exp-02-05
  - google/gemini-pro-1.5
  - google/gemma-2-2b-it
  - google/gemma-2-9b-it
  - google/gemma-3-27b-it

  # Meta
  - meta-llama/llama-3.1-8b-instruct
  - meta-llama/llama-3.1-405b-instruct
  - meta-llama/llama-3.2-1b-instruct
  - meta-llama/llama-3.2-3b-instruct
  - meta-llama/llama-4-maverick
  - meta-llama/llama-4-scout

  # Mistral
  - mistralai/mistral-7b-instruct-v0.1
  - mistralai/mistral-large-2407
  - mistralai/mistral-nemo

  # Qwen
  - qwen/qwen3-8b
  - qwen/qwen3-14b
  - qwen/qwen3-32b
  - qwen/qwen3-235b-a22b

  # Cohere
  - cohere/command-a
  - cohere/command-r-08-2024
  - cohere/command-r-plus-08-2024
  - cohere/command-r7b-12-2024

  # NVIDIA / DeepSeek / xAI
  - nvidia/llama-3.1-nemotron-70b-instruct
  - deepseek/deepseek-chat-v3-0324
  - x-ai/grok-4

reasoning_models:
  - openai/o3
  - openai/o4-mini

reasoning:
  effort: "low"
  exclude: true

reasoning_max_tokens_multiplier: 4

# zero-shot only (no bok_models -> no best-of-k samples for any model)

temperature: 0.0
max_tokens: 32
seed: 42

concurrency: 10
max_retries: 4
