# Phase 5 — DRAT-3A coverage expansion to all 42 RAT-pool models that
# don't yet have DRAT-3A scores. Same expert anchor bank, same scoring,
# same hyperparameters as phase 4. Brings the DRAT-3A pool from
# 27 -> 69 models, matching the post-rerun RAT pool.
#
# Reasoning models (gpt-5 family, qwen3-14b/32b/8b, o-series, gemini-3.x
# preview, claude-haiku-4.5, grok-4) receive the 8x token multiplier so
# they don't burn the budget thinking before producing the 10 words.

output_dir: "data/new_tests/drat/pilot_phase5_expansion"
prompt_style: "analogical"

models:
  # Anthropic
  - anthropic/claude-3-haiku
  - anthropic/claude-haiku-4.5
  - anthropic/claude-opus-4.5
  - anthropic/claude-opus-4.6
  - anthropic/claude-sonnet-4
  - anthropic/claude-sonnet-4.5
  - anthropic/claude-sonnet-4.6

  # OpenAI
  - openai/gpt-3.5-turbo
  - openai/gpt-4.1
  - openai/gpt-4.1-mini
  - openai/gpt-4.1-nano
  - openai/gpt-5
  - openai/gpt-5.2
  - openai/gpt-5.4
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/gpt-5.4-mini
  - openai/gpt-5.4-nano
  - openai/o3
  - openai/o4-mini

  # Google
  - google/gemini-2.5-flash
  - google/gemini-2.5-pro
  - google/gemini-3-flash-preview
  - google/gemini-3.1-pro-preview
  - google/gemma-3-27b-it

  # Meta
  - meta-llama/llama-3.1-8b-instruct
  - meta-llama/llama-3.2-1b-instruct
  - meta-llama/llama-3.2-3b-instruct
  - meta-llama/llama-4-maverick
  - meta-llama/llama-4-scout

  # Mistral
  - mistralai/mistral-7b-instruct-v0.1
  - mistralai/mistral-large-2407

  # Qwen
  - qwen/qwen3-8b
  - qwen/qwen3-14b
  - qwen/qwen3-32b
  - qwen/qwen3-235b-a22b

  # Cohere
  - cohere/command-a
  - cohere/command-r-08-2024
  - cohere/command-r-plus-08-2024
  - cohere/command-r7b-12-2024

  # DeepSeek / xAI
  - deepseek/deepseek-chat-v3-0324
  - x-ai/grok-4

reasoning_models:
  - openai/gpt-5
  - openai/gpt-5.2
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/gpt-5.4-mini
  - openai/gpt-5.4-nano
  - openai/o3
  - openai/o4-mini
  - google/gemini-3.1-pro-preview
  - google/gemini-3-flash-preview
  - qwen/qwen3-8b
  - qwen/qwen3-14b
  - qwen/qwen3-32b

reasoning:
  effort: "low"
  exclude: true

reasoning_max_tokens_multiplier: 8

anchor_groups:
  - {anchors: ["heart", "engine", "marketplace"]}
  - {anchors: ["immune system", "fire", "organization"]}
  - {anchors: ["evolution", "friction", "election"]}
  - {anchors: ["genome", "lattice", "algorithm"]}
  - {anchors: ["heartbeat", "wave", "oscillator"]}
  - {anchors: ["neuron", "particle", "graph"]}
  - {anchors: ["lung", "turbulence", "turbine"]}
  - {anchors: ["immune system", "friction", "supply chain"]}
  - {anchors: ["cell", "crystal", "factory"]}
  - {anchors: ["genome", "contract", "proof"]}
  - {anchors: ["evolution", "marketplace", "algorithm"]}
  - {anchors: ["ecosystem", "neighborhood", "graph"]}
  - {anchors: ["immune system", "marketplace", "supply chain"]}
  - {anchors: ["ant colony", "organization", "factory"]}
  - {anchors: ["heart", "parliament", "machine"]}
  - {anchors: ["genome", "algorithm", "factory"]}
  - {anchors: ["heartbeat", "oscillator", "pipeline"]}
  - {anchors: ["neuron", "graph", "circuit"]}
  - {anchors: ["phase transition", "revolution", "function"]}
  - {anchors: ["entropy", "hierarchy", "information"]}
  - {anchors: ["gravity", "hierarchy", "lattice"]}
  - {anchors: ["turbulence", "traffic", "pipeline"]}
  - {anchors: ["heat", "marketplace", "refrigerator"]}
