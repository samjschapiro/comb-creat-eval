# RAT Pilot — 30-item Bowden & Jung-Beeman 2003 subset on the same model
# pool we have DRAT and LIB for.

output_dir: "data/new_tests/rat/pilot_v1"

# Same 25 models in the DRAT pool. RAT scoring doesn't need Arena/MMLU,
# so the pool is the broader DRAT-LIB pool, not the n=19 specificity subset.
models:
  # Phase 1-3 (LIB-17 cheap+mid+expensive)
  - google/gemini-2.0-flash-lite-001
  - microsoft/phi-4
  - google/gemma-2-27b-it
  - mistralai/mistral-small-24b-instruct-2501
  - google/gemini-2.0-flash-001
  - meta-llama/llama-3.3-70b-instruct
  - openai/gpt-4o-mini
  - anthropic/claude-3.5-haiku
  - deepseek/deepseek-chat
  - qwen/qwen-2.5-72b-instruct
  - meta-llama/llama-3.1-70b-instruct
  - mistralai/mistral-large-2411
  - openai/gpt-4o
  - openai/gpt-4-turbo
  - deepseek/deepseek-r1
  - openai/o3-mini

  # Phase 4 (LIB-leaderboard expansion)
  - anthropic/claude-3.7-sonnet
  - anthropic/claude-3.7-sonnet:thinking
  - deepseek/deepseek-r1-distill-llama-70b
  - deepseek/deepseek-r1-distill-qwen-32b
  - qwen/qwen-max
  - qwen/qwen-2.5-coder-32b-instruct
  - qwen/qwen-2.5-7b-instruct
  - amazon/nova-pro-v1
  - amazon/nova-lite-v1

reasoning_models:
  - anthropic/claude-3.7-sonnet:thinking
  - openai/o3-mini
  - deepseek/deepseek-r1
  - deepseek/deepseek-r1-distill-llama-70b
  - deepseek/deepseek-r1-distill-qwen-32b

reasoning:
  effort: "low"
  exclude: true

reasoning_max_tokens_multiplier: 4

# items: omitted -> use ITEM_BANK_V1 from src/new_tests/rat.py (30 items)

temperature: 0.0       # zero-shot: deterministic, matches RAT literature convention
max_tokens: 32         # 1-word answer; reasoning models get 4x via multiplier
seed: 42

# Best-of-K: run K samples at higher temperature, score correct if ANY match.
# Only on non-reasoning models for the pilot — see whether BoK gain on cheap
# models matches reasoning-model zero-shot accuracy. Decide afterward whether
# to expand BoK to reasoning models.
bok_k: 10
bok_temperature: 1.0
bok_models:
  - google/gemini-2.0-flash-lite-001
  - microsoft/phi-4
  - google/gemma-2-27b-it
  - mistralai/mistral-small-24b-instruct-2501
  - google/gemini-2.0-flash-001
  - meta-llama/llama-3.3-70b-instruct
  - openai/gpt-4o-mini
  - anthropic/claude-3.5-haiku
  - deepseek/deepseek-chat
  - qwen/qwen-2.5-72b-instruct
  - meta-llama/llama-3.1-70b-instruct
  - mistralai/mistral-large-2411
  - openai/gpt-4o
  - openai/gpt-4-turbo
  - anthropic/claude-3.7-sonnet
  - qwen/qwen-max
  - qwen/qwen-2.5-coder-32b-instruct
  - qwen/qwen-2.5-7b-instruct
  - amazon/nova-pro-v1
  - amazon/nova-lite-v1

concurrency: 10
max_retries: 4
