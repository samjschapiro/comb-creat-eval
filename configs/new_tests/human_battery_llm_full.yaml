# The human DRAT study's battery (DRAT, RAT, SCTT) on the 44 dat_eval-pool models still on OpenRouter
# (2026-11-10). Items and wording are the human study's (src/new_tests/human_battery.py). DAT reused from dat_eval.
upstream_dir: data/DRAT_data_for_Sam_20261110
output_dir: data/new_tests/human_battery_llm/full_20261110
budget_usd: 50.0          # hard stop on billed spend for this run (key had $85.78 left on 2026-11-10)
concurrency: 8
model_concurrency: 6   # models run at once (added after the first 8 models ran one at a time; results unaffected)
max_retries: 4
seed: 42
tests:
  drat: {samples: 1, temperature: 1.0, max_tokens: 400, max_tokens_reasoning: 4000}   # as in the dat_eval/new_tests DRAT runs
  rat: {samples: 1, temperature: 0.0, max_tokens: 32, max_tokens_reasoning: 4000}     # as in the RAT runs; reasoning cap raised after gpt-5-nano used 1,610 in the smoke test
  sctt: {samples: 3, temperature: 1.0, max_tokens: 800, max_tokens_reasoning: 4000}
# Reasoning is requested (low effort, trace excluded) only for models that cannot turn it off, as in the
# earlier DRAT backfill; every other model runs without a reasoning block.
reasoning: {effort: low, exclude: true}
reasoning_models:
- openai/gpt-5
- openai/gpt-5.2
- openai/gpt-5.4
- openai/gpt-5-mini
- openai/gpt-5-nano
