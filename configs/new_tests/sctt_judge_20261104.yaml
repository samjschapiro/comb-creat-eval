# LLM-as-judge scoring of the human SCTT responses (main run, 2026-10-27 export), following
# Beaty et al. (SCTT preprint, PsyArXiv y5fbs): holistic 1 (not at all creative) - 5 (very creative),
# raters consider both originality and plausibility (adapted Silvia et al., 2008 guidelines).
upstream_dir: data/DRAT_data_for_Sam_20261027
reference_dir: data/new_tests/drat_human/sctt_reference   # preprint text + OSF rated example responses
output_dir: data/new_tests/drat_human/sctt_judge_20261104
sample: main
repeat_fraction: 0.06   # hidden duplicate responses (new ids) to measure judge test-retest consistency
seed: 0
apply_exclude: false   # this package predates the `exclude` column
