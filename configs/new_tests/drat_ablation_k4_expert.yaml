  - {anchors: ['immune system', 'fire', 'organization', 'theorem']}
  - {anchors: ['evolution', 'friction', 'election', 'polynomial']}
  - {anchors: ['genome', 'lattice', 'algorithm', 'court']}
  - {anchors: ['heartbeat', 'wave', 'oscillator', 'function']}
  - {anchors: ['neuron', 'particle', 'graph', 'ritual']}
  - {anchors: ['lung', 'turbulence', 'turbine', 'matrix']}
  - {anchors: ['immune system', 'friction', 'supply chain', 'axiom']}
  - {anchors: ['cell', 'crystal', 'factory', 'treaty']}
  - {anchors: ['genome', 'contract', 'proof', 'pipeline']}
  - {anchors: ['evolution', 'marketplace', 'algorithm', 'motor']}
  - {anchors: ['ecosystem', 'neighborhood', 'graph', 'pressure']}
  - {anchors: ['immune system', 'marketplace', 'supply chain', 'distribution']}
  - {anchors: ['ant colony', 'organization', 'factory', 'vertex']}
  - {anchors: ['heart', 'parliament', 'machine', 'set']}
  - {anchors: ['genome', 'algorithm', 'factory', 'festival']}
  - {anchors: ['heartbeat', 'oscillator', 'pipeline', 'topology']}
  - {anchors: ['neuron', 'graph', 'circuit', 'senate']}
  - {anchors: ['phase transition', 'revolution', 'function', 'heartbeat']}
