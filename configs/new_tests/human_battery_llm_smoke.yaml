# Smoke test of the human-battery LLM run: all items on 3 cheap models (one reasoning), $1 cap.
upstream_dir: data/DRAT_data_for_Sam_20261110
output_dir: data/new_tests/human_battery_llm/smoke_20261110
budget_usd: 1.0           # smoke test: 3 cheap models, all items
concurrency: 8
model_concurrency: 6   # models run at once (added after the first 8 models ran one at a time; results unaffected)
max_retries: 4
seed: 42
tests:
  drat: {samples: 1, temperature: 1.0, max_tokens: 400, max_tokens_reasoning: 4000}   # as in the dat_eval/new_tests DRAT runs
  rat: {samples: 1, temperature: 0.0, max_tokens: 32, max_tokens_reasoning: 2000}     # as in the RAT runs
  sctt: {samples: 3, temperature: 1.0, max_tokens: 800, max_tokens_reasoning: 4000}
# Reasoning is requested (low effort, trace excluded) only for models that cannot turn it off, as in the
# earlier DRAT backfill; every other model runs without a reasoning block.
reasoning: {effort: low, exclude: true}
reasoning_models:
- openai/gpt-5
- openai/gpt-5.2
- openai/gpt-5.4
- openai/gpt-5-mini
- openai/gpt-5-nano
- openai/gpt-5.4-mini
- openai/gpt-5.4-nano
- openai/o3
- google/gemini-2.5-pro
- google/gemini-3.1-pro-preview
- google/gemini-3-flash-preview
- qwen/qwen3-14b
- qwen/qwen3-32b
models:
- mistralai/mistral-nemo
- meta-llama/llama-3.1-8b-instruct
- openai/gpt-5-nano
