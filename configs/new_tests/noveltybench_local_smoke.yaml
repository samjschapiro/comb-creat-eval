# SMOKE TEST — validates local MLX generation + DeBERTa(MPS) + gpt-4o-mini judge.
test_model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
subset: "NB-Curated"
max_prompts: 3
k: 4
temperature: 1.0
top_p: 1.0
max_tokens: 256
patience: 0.8
distinctness_method: "deberta"
distinctness_threshold: 0.5
distinctness_device: "mps"
quality_judge_model: "openai/gpt-4o-mini"
generation_concurrency: 4
judge_concurrency: 4
output_dir: "data/new_tests/noveltybench/_smoke_llama3b"
