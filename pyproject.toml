[project]
name = "comb-creat-eval"
version = "0.1.0"
description = "Combinatorial creativity evaluation for LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "pyyaml",
    "openai",
    "requests",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "python-dotenv",
    "playwright>=1.58.0",
    "sentence-transformers>=5.4.0",
    "cmcrameri>=1.9",
    "nltk>=3.9.4",
    "datasets>=4.8.5",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "transformers>=4.45,<4.50",
    "protobuf>=7.34.1",
]

[project.optional-dependencies]
creativity_rl = [
    # torch pinned to a CUDA 12.4 build: Lambda hosts vary in NVIDIA
    # driver version, and newer cu128/cu130 wheels fail on driver 570
    # (CUDA 12.8 max). 2.6.0+cu124 works on driver 570 and 580 alike.
    "torch==2.6.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "trl>=0.16,<0.22",
    "bitsandbytes>=0.45",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.5",
    "wandb>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# Resolve torch from the PyTorch CUDA 12.4 index so uv (including the
# implicit re-sync on every `uv run`) stays consistent with the pin
# above, instead of pulling the default cu130 wheel from PyPI.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
