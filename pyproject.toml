[project]
name = "comb-creat-eval"
version = "0.1.0"
description = "Combinatorial creativity evaluation for LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "pyyaml",
    "openai",
    "requests",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "python-dotenv",
    "playwright>=1.58.0",
    "sentence-transformers>=5.4.0",
    "cmcrameri>=1.9",
    "nltk>=3.9.4",
    "datasets>=4.8.5",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "transformers>=4.45,<4.50",
    "protobuf>=7.34.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
