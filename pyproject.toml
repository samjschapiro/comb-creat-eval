[project]
name = "comb-creat-eval"
version = "0.1.0"
description = "Combinatorial creativity evaluation for LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "networkx",
    "pyyaml",
    "openai",
    "requests",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",
    "python-dotenv",
    "playwright>=1.58.0",
    "sentence-transformers>=5.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
